name: Tests

# The suites run locally before each commit. CI runs them on Linux with Python 3.11 for a pull request, and on macOS and
# Linux with Python 3.11 and 3.15 when started by hand on the release commit; a v* tag only checks that it names the
# plugin's version (ADR 0002).
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  unittest:
    if: ${{ github.event_name != 'push' }}
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "macos-15"]') }}
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.11"]') || fromJSON('["3.11", "3.15"]') }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          # Runs are few and short; a cache would add a save step to each job for little reuse.
          enable-cache: false

      # Installs exactly what bridge.py.lock records; --locked fails if the lock is stale.
      - name: Install the locked test environment
        id: deps
        env:
          TEST_PYTHON: ${{ matrix.python }}
        run: |
          uv venv --managed-python --python "$TEST_PYTHON" .venv
          VIRTUAL_ENV="$PWD/.venv" uv sync --active --locked \
            --script plugins/peer-bridge/scripts/bridge.py

      # The newest Codex, for the check that it still knows every feature and setting the bridge turns off
      # (ADR 0002). The package has no install scripts; Codex runs only in an empty temporary home, and this job holds
      # no secrets.
      - name: Install Codex
        run: npm install --global --ignore-scripts @openai/codex

      - name: Run plugin tests
        run: .venv/bin/python -m unittest discover -s plugins/peer-bridge/tests

      - name: Run developer tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: .venv/bin/python -m unittest discover -s dev/tests -t dev/tests

  # The suites already passed on this commit in the run started by hand; the tag only has to name the version they
  # tested. test_repository ties the Codex manifest and the changelog to the same version.
  tag-version:
    if: ${{ github.event_name == 'push' }}
    name: Tag names the plugin version
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag with plugin.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' \
            plugins/peer-bridge/.claude-plugin/plugin.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not name the plugin version $version (expected v$version)."
            exit 1
          fi
